<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meeting actions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9ecea;
    --surface: #f6f7f6;
    --surface-2: #eceeed;
    --ink: #232826;
    --ink-soft: #5d6662;
    --line: #d3d8d5;
    --accent: #e8650a;
    --accent-ink: #ffffff;
    --red: #c0281f;
    --red-bg: #fbe9e7;
    --shadow: 0 1px 2px rgba(35, 40, 38, 0.06), 0 6px 18px rgba(35, 40, 38, 0.05);
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #181c1a;
      --surface: #222725;
      --surface-2: #2b312e;
      --ink: #eceeed;
      --ink-soft: #a2aca7;
      --line: #363d39;
      --accent: #f07a1f;
      --accent-ink: #1a1a18;
      --red: #ff8a80;
      --red-bg: #3a2523;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #181c1a;
    --surface: #222725;
    --surface-2: #2b312e;
    --ink: #eceeed;
    --ink-soft: #a2aca7;
    --line: #363d39;
    --accent: #f07a1f;
    --accent-ink: #1a1a18;
    --red: #ff8a80;
    --red-bg: #3a2523;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 18px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 40px 20px 72px; }

  h1 { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; }
  .sub { color: var(--ink-soft); margin: 0 0 28px; font-size: 1.05rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }

  /* Summary */
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
  .stat { padding: 18px 20px; }
  .stat .num { font-size: 2.6rem; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
  .stat .lbl { color: var(--ink-soft); font-size: 1rem; margin-top: 6px; }
  .stat.open .num { color: var(--accent); }
  .stat.late.has .num, .stat.late.has .lbl { color: var(--red); }
  .stat.late.has { background: var(--red-bg); border-color: transparent; }
  .progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-bottom: 28px; }
  .progress > div { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; }

  /* Add form */
  .add { padding: 22px; margin-bottom: 32px; }
  .add h2 { font-size: 1.2rem; margin: 0 0 14px; font-weight: 600; }
  .fields { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 720px) {
    .fields { grid-template-columns: 2.2fr 1fr 1fr auto; align-items: end; }
  }
  label { display: block; font-size: 0.95rem; color: var(--ink-soft); font-weight: 500; margin-bottom: 6px; }
  input[type="text"], input[type="date"] {
    width: 100%;
    font: inherit;
    font-size: 1.05rem;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px 14px;
    min-height: 52px;
  }
  input::placeholder { color: var(--ink-soft); opacity: 0.8; }
  input:focus-visible, button:focus-visible, .check:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .btn {
    font: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 12px;
    padding: 0 26px;
    min-height: 52px;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px); }

  /* Owner cards */
  .owners { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
  @media (min-width: 820px) { .owners { grid-template-columns: 1fr 1fr; } }
  .owner { padding: 8px 8px 10px; }
  .owner-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 14px 10px; }
  .owner-head h3 { margin: 0; font-size: 1.35rem; font-weight: 700; overflow-wrap: anywhere; }
  .owner-head .meta { color: var(--ink-soft); font-size: 0.95rem; white-space: nowrap; }
  .owner-head .meta .late { color: var(--red); font-weight: 700; }

  ul { list-style: none; margin: 0; padding: 0; }
  .item {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 14px;
    align-items: start;
    padding: 14px;
    border-radius: 12px;
    border-left: 4px solid transparent;
  }
  .item + .item { margin-top: 4px; }
  .item.overdue { background: var(--red-bg); border-left-color: var(--red); }
  .item .text { font-size: 1.15rem; font-weight: 500; overflow-wrap: anywhere; }
  .item .due { font-size: 0.95rem; color: var(--ink-soft); margin-top: 2px; }
  .item.overdue .due { color: var(--red); font-weight: 700; }
  .item.done .text { text-decoration: line-through; color: var(--ink-soft); font-weight: 400; }
  .item.done .due { opacity: 0.8; }

  .check {
    appearance: none; -webkit-appearance: none;
    width: 30px; height: 30px; margin: 1px 0 0;
    border: 2px solid var(--ink-soft);
    border-radius: 9px;
    background: transparent;
    cursor: pointer;
    display: grid; place-content: center;
    flex: none;
  }
  .check:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .check:checked::after {
    content: "";
    width: 14px; height: 8px;
    border-left: 3px solid var(--accent-ink);
    border-bottom: 3px solid var(--accent-ink);
    transform: translateY(-2px) rotate(-45deg);
  }
  .item.overdue .check:not(:checked) { border-color: var(--red); }

  .del {
    background: none; border: 0; color: var(--ink-soft);
    font: inherit; font-size: 1.5rem; line-height: 1;
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
  }
  .del:hover { background: var(--surface-2); color: var(--ink); }

  .empty {
    text-align: center; padding: 48px 20px; color: var(--ink-soft);
  }
  .empty strong { display: block; color: var(--ink); font-size: 1.25rem; margin-bottom: 4px; }

  @media (max-width: 560px) {
    body { font-size: 17px; }
    .wrap { padding-top: 28px; }
    h1 { font-size: 1.8rem; }
    .stat { padding: 14px; }
    .stat .num { font-size: 2.1rem; }
    .summary { gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .progress > div { transition: none; }
  }

  .status { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:-12px 0 24px; font-size:0.95rem; color:var(--ink-soft); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--ink-soft); flex:none; }
  .status.live .dot { background:var(--accent); }
  .status.err { color:var(--red); font-weight:600; }
  .status.err .dot { background:var(--red); }
  .link { font:inherit; font-weight:600; color:var(--ink); background:none; border:0; border-bottom:2px solid var(--accent); padding:0; cursor:pointer; }
  .banner { padding:16px 20px; margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .banner .btn { min-height:44px; }
  .banner[hidden] { display:none; }

  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:8px; }
  .top .sub { margin-bottom:20px; }
  .userbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-top:6px; }
  .userbar[hidden], .panel[hidden], #app[hidden], #login[hidden], #btn-users[hidden] { display:none; }
  .who { font-weight:600; margin-right:6px; }
  .chip { font:inherit; font-size:0.95rem; font-weight:600; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:9px 16px; min-height:44px; cursor:pointer; }
  .chip:hover { background:var(--surface-2); }
  .chip.strong { border-color:var(--ink); }
  .login { max-width:460px; margin:24px auto 0; padding:28px; }
  .login h2, .panel h2 { font-size:1.3rem; margin:0 0 16px; font-weight:700; }
  .stack { display:grid; gap:14px; }
  .login .btn, .panel .btn { width:100%; }
  .panel { padding:22px; margin-bottom:20px; }
  .panel .grid2 { display:grid; grid-template-columns:1fr; gap:14px; }
  @media (min-width:720px) { .panel .grid2 { grid-template-columns:1fr 1fr; } }
  .msg { margin:0; font-size:0.98rem; min-height:1.4em; }
  .msg.err { color:var(--red); font-weight:600; }
  .msg.ok { color:var(--ink); font-weight:600; }
  .inline { display:flex; align-items:center; gap:10px; font-size:1.05rem; }
  .inline input { width:22px; height:22px; accent-color:var(--accent); }
  .inline label { margin:0; color:var(--ink); font-size:1.05rem; }
  .team { margin:14px 0 0; color:var(--ink-soft); font-size:0.98rem; }
  input[type="password"] { width:100%; font:inherit; font-size:1.05rem; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:13px 14px; min-height:52px; }
  input[type="password"]:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Meeting actions</h1>
      <p class="sub">Write down who does what, and by when. Nothing gets forgotten.</p>
    </div>
    <div class="userbar" id="userbar" hidden>
      <span class="who" id="who"></span>
      <button class="chip" id="btn-users" type="button" hidden>Add user</button>
      <button class="chip" id="btn-pass" type="button">Change password</button>
      <button class="chip strong" id="btn-out" type="button">Sign out</button>
    </div>
  </header>

  <section class="card login" id="login" aria-labelledby="login-h">
    <h2 id="login-h">Sign in</h2>
    <form id="login-form" class="stack" autocomplete="on">
      <div>
        <label for="l-user">Username</label>
        <input type="text" id="l-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div>
        <label for="l-pass">Password</label>
        <input type="password" id="l-pass" name="password" autocomplete="current-password" required>
      </div>
      <p class="msg err" id="l-msg" role="alert"></p>
      <button class="btn" type="submit" id="l-btn">Sign in</button>
    </form>
  </section>

  <div id="app" hidden>
    <section class="card panel" id="panel-pass" hidden aria-labelledby="pass-h">
      <h2 id="pass-h">Change your password</h2>
      <form id="pass-form" class="stack" autocomplete="off">
        <div class="grid2">
          <div>
            <label for="p-new">New password</label>
            <input type="password" id="p-new" autocomplete="new-password" minlength="6" required>
          </div>
          <div>
            <label for="p-new2">Repeat new password</label>
            <input type="password" id="p-new2" autocomplete="new-password" minlength="6" required>
          </div>
        </div>
        <p class="msg" id="p-msg" role="status"></p>
        <button class="btn" type="submit">Save password</button>
      </form>
    </section>

    <section class="card panel" id="panel-users" hidden aria-labelledby="users-h">
      <h2 id="users-h">Add a user</h2>
      <form id="user-form" class="stack" autocomplete="off">
        <div class="grid2">
          <div>
            <label for="u-name">Username</label>
            <input type="text" id="u-name" placeholder="e.g. priya" autocapitalize="none" spellcheck="false" maxlength="30" required>
          </div>
          <div>
            <label for="u-display">Display name</label>
            <input type="text" id="u-display" placeholder="e.g. Priya" maxlength="40">
          </div>
          <div>
            <label for="u-pass">Initial password</label>
            <input type="text" id="u-pass" placeholder="At least 6 characters" autocomplete="off" minlength="6" required>
          </div>
          <div class="inline" style="align-self:end;min-height:52px">
            <input type="checkbox" id="u-admin">
            <label for="u-admin">Can add other users</label>
          </div>
        </div>
        <p class="msg" id="u-msg" role="status"></p>
        <button class="btn" type="submit">Create user</button>
      </form>
      <p class="team" id="team"></p>
    </section>

    <div class="status" id="status" role="status"><span class="dot"></span><span id="status-text">Connecting\u2026</span><button class="link" id="retry" type="button" hidden>Try again</button></div>
    <div class="card banner" id="import-banner" hidden>
      <span id="import-text"></span>
      <button class="btn" id="import-btn" type="button">Import to Supabase</button>
    </div>

    <section class="summary" aria-label="Summary">
      <div class="card stat open"><div class="num" id="n-open">0</div><div class="lbl">Open</div></div>
      <div class="card stat done"><div class="num" id="n-done">0</div><div class="lbl">Done</div></div>
      <div class="card stat late" id="stat-late"><div class="num" id="n-late">0</div><div class="lbl">Overdue</div></div>
    </section>
    <div class="progress" role="progressbar" aria-label="Share of actions done" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><div id="bar-fill"></div></div>

    <section class="card add">
      <h2>Add an action</h2>
      <form id="form" autocomplete="off">
        <div class="fields">
          <div>
            <label for="f-text">What needs to happen?</label>
            <input type="text" id="f-text" placeholder="Send the revised budget to finance" required maxlength="200">
          </div>
          <div>
            <label for="f-owner">Owner</label>
            <input type="text" id="f-owner" list="owner-list" placeholder="Name" required maxlength="40">
            <datalist id="owner-list"></datalist>
          </div>
          <div>
            <label for="f-due">Due date</label>
            <input type="date" id="f-due" required>
          </div>
          <button class="btn" type="submit">Add action</button>
        </div>
      </form>
    </section>

    <main id="owners" class="owners" aria-live="polite"></main>
  </div>
</div>

<script>
(function () {
  var SB_URL = "https://nuystrzzcexbwotrrxxa.supabase.co";
  var SB_KEY = "sb_publishable__DSToJzARzJY6ALkxWIb6w_TCIbt40v";
  var EMAIL_DOMAIN = "@meetingactions.example.com";
  var TABLE = SB_URL + "/rest/v1/meeting_actions";
  var SESSION_KEY = "meeting-actions-session";
  var OLD_KEY = "meeting-actions-v1";
  var POLL_MS = 15000;

  var actions = [];
  var team = [];
  var me = null;
  var session = null;
  var busy = 0;
  var pollTimer = null;
  var refreshing = null;

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- Session storage ---------- */
  function loadSession() {
    try {
      var raw = localStorage.getItem(SESSION_KEY);
      var s = raw ? JSON.parse(raw) : null;
      return s && s.access_token && s.refresh_token ? s : null;
    } catch (e) { return null; }
  }
  function saveSession(s) {
    session = s;
    try {
      if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
      else localStorage.removeItem(SESSION_KEY);
    } catch (e) { /* storage unavailable: session lasts until reload */ }
  }
  function toSession(data) {
    return {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: data.expires_at || (Math.floor(Date.now() / 1000) + (data.expires_in || 3600)),
      user_id: (data.user && data.user.id) || jwtSub(data.access_token)
    };
  }

  /* ---------- HTTP helpers ---------- */
  function errText(r) {
    return r.text().then(function (t) {
      try {
        var j = JSON.parse(t);
        return j.message || j.error_description || j.msg || j.error || t;
      } catch (e) { return t || ("HTTP " + r.status); }
    });
  }
  function authCall(path, body) {
    return fetch(SB_URL + "/auth/v1" + path, {
      method: "POST",
      headers: { "apikey": SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    });
  }
  function jwtSub(token) {
    try {
      var b = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      return JSON.parse(atob(b)).sub;
    } catch (e) { return null; }
  }

  function refreshSession() {
    if (refreshing) return refreshing;
    if (!session) return Promise.reject(new Error("No session"));
    refreshing = authCall("/token?grant_type=refresh_token", { refresh_token: session.refresh_token })
      .then(function (r) {
        if (!r.ok) throw new Error("Session expired");
        return r.json();
      })
      .then(function (d) { saveSession(toSession(d)); })
      .then(function () { refreshing = null; }, function (e) { refreshing = null; throw e; });
    return refreshing;
  }

  function authedFetch(url, opts, retried) {
    if (!session) return Promise.reject(new Error("Signed out"));
    var ready = (session.expires_at * 1000 - Date.now() < 60000) ? refreshSession() : Promise.resolve();
    return ready.then(function () {
      opts = opts || {};
      var headers = opts.headers || {};
      headers["apikey"] = SB_KEY;
      headers["Authorization"] = "Bearer " + session.access_token;
      headers["Content-Type"] = "application/json";
      return fetch(url, { method: opts.method || "GET", headers: headers, body: opts.body });
    }).then(function (r) {
      if (r.status === 401 && !retried) {
        return refreshSession().then(function () { return authedFetch(url, opts, true); });
      }
      if (r.status === 401) { forceSignOut("Your session ended. Please sign in again."); throw new Error("Unauthorised"); }
      return r;
    }, function (e) {
      if (e && e.message === "Session expired") { forceSignOut("Your session ended. Please sign in again."); }
      throw e;
    });
  }

  function sb(query, opts) {
    opts = opts || {};
    var headers = {};
    if (opts.returning) headers["Prefer"] = "return=representation";
    return authedFetch(TABLE + (query || ""), {
      method: opts.method, headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      if (!r.ok) return errText(r).then(function (t) { throw new Error(t); });
      return r.status === 204 ? null : r.json();
    });
  }
  function rpc(name, args) {
    return authedFetch(SB_URL + "/rest/v1/rpc/" + name, { method: "POST", body: JSON.stringify(args) })
      .then(function (r) {
        if (!r.ok) return errText(r).then(function (t) { throw new Error(t); });
        return r.json();
      });
  }

  /* ---------- Sign in / out ---------- */
  function showLogin(message) {
    $("app").hidden = true;
    $("userbar").hidden = true;
    $("login").hidden = false;
    $("l-msg").textContent = message || "";
    $("l-pass").value = "";
    closePanels();
  }
  function showApp() {
    $("login").hidden = true;
    $("app").hidden = false;
    $("userbar").hidden = false;
    $("who").textContent = "Signed in as " + me.display_name;
    $("btn-users").hidden = !me.is_admin;
  }
  function closePanels() {
    $("panel-pass").hidden = true;
    $("panel-users").hidden = true;
  }

  function forceSignOut(message) {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    saveSession(null);
    me = null; actions = []; team = [];
    showLogin(message);
  }
  function signOut() {
    var tok = session && session.access_token;
    if (tok) {
      fetch(SB_URL + "/auth/v1/logout", {
        method: "POST", headers: { "apikey": SB_KEY, "Authorization": "Bearer " + tok, "Content-Type": "application/json" }
      }).catch(function () {});
    }
    forceSignOut("");
  }

  $("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = $("l-user").value.trim().toLowerCase();
    var pw = $("l-pass").value;
    if (!u || !pw) return;
    $("l-msg").textContent = "";
    $("l-btn").disabled = true;
    authCall("/token?grant_type=password", { email: u + EMAIL_DOMAIN, password: pw })
      .then(function (r) {
        if (r.status === 400 || r.status === 401) throw new Error("Wrong username or password.");
        if (!r.ok) return errText(r).then(function (t) { throw new Error(t); });
        return r.json();
      })
      .then(function (d) { saveSession(toSession(d)); return boot(); })
      .catch(function (err) {
        var m = err && err.message || "";
        $("l-msg").textContent = /Wrong username/.test(m) ? m : "Can\u2019t sign in right now. Check your connection and try again.";
      })
      .then(function () { $("l-btn").disabled = false; });
  });
  $("btn-out").addEventListener("click", signOut);

  /* ---------- Panels: change password, add user ---------- */
  function togglePanel(id, focusId) {
    var panel = $(id);
    var willOpen = panel.hidden;
    closePanels();
    panel.hidden = !willOpen;
    if (willOpen) $(focusId).focus();
  }
  $("btn-pass").addEventListener("click", function () {
    $("p-msg").textContent = ""; $("p-msg").className = "msg";
    togglePanel("panel-pass", "p-new");
  });
  $("btn-users").addEventListener("click", function () {
    $("u-msg").textContent = ""; $("u-msg").className = "msg";
    renderTeam();
    togglePanel("panel-users", "u-name");
  });

  function say(id, kind, text) { var n = $(id); n.className = "msg " + kind; n.textContent = text; }

  $("pass-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var a = $("p-new").value, b = $("p-new2").value;
    if (a.length < 6) return say("p-msg", "err", "Use at least 6 characters.");
    if (a !== b) return say("p-msg", "err", "The two passwords don\u2019t match.");
    say("p-msg", "", "Saving\u2026");
    authedFetch(SB_URL + "/auth/v1/user", { method: "PUT", body: JSON.stringify({ password: a }) })
      .then(function (r) {
        if (!r.ok) return errText(r).then(function (t) { throw new Error(t); });
        $("p-new").value = ""; $("p-new2").value = "";
        say("p-msg", "ok", "Password changed. Use it next time you sign in.");
      })
      .catch(function (err) { say("p-msg", "err", err.message || "Couldn\u2019t change the password."); });
  });

  $("user-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var uname = $("u-name").value.trim().toLowerCase();
    var pw = $("u-pass").value;
    say("u-msg", "", "Creating\u2026");
    rpc("admin_create_user", {
      p_username: uname, p_password: pw,
      p_display_name: $("u-display").value.trim() || null,
      p_is_admin: $("u-admin").checked
    }).then(function () {
      say("u-msg", "ok", "Added " + uname + ". Share the initial password with them and ask them to change it after signing in.");
      $("u-name").value = ""; $("u-display").value = ""; $("u-pass").value = ""; $("u-admin").checked = false;
      return loadTeam();
    }).then(renderTeam).catch(function (err) {
      say("u-msg", "err", err.message || "Couldn\u2019t add that user.");
    });
  });

  function loadTeam() {
    return authedFetch(SB_URL + "/rest/v1/profiles?select=username,display_name,is_admin&order=display_name.asc")
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rows) { team = rows; render(); });
  }
  function renderTeam() {
    $("team").textContent = team.length
      ? "Team: " + team.map(function (t) { return t.display_name + " (" + t.username + (t.is_admin ? ", admin" : "") + ")"; }).join(", ")
      : "";
  }

  /* ---------- Data ---------- */
  function setStatus(kind, msg) {
    var box = $("status");
    box.className = "status" + (kind ? " " + kind : "");
    $("status-text").textContent = msg;
    $("retry").hidden = kind !== "err";
  }
  function timeNow() {
    return new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }
  function refresh() {
    if (busy || !session) return Promise.resolve();
    return sb("?select=id,text,owner,due,done&order=due.asc")
      .then(function (rows) {
        actions = rows;
        setStatus("live", "Live from Supabase, updated " + timeNow());
        render();
      })
      .catch(function () {
        if (session) setStatus("err", "Can\u2019t reach Supabase. Showing the last data loaded.");
      });
  }
  function mutate(fn) {
    busy++;
    return fn().then(function () { busy--; }, function (e) { busy--; throw e; });
  }
  function fail() {
    setStatus("err", "That change didn\u2019t save. Check your connection and try again.");
  }

  /* ---------- Dates ---------- */
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function parseDate(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
  function isOverdue(a) { return !a.done && a.due < todayStr(); }
  function dueLabel(a) {
    var diff = daysBetween(todayStr(), a.due);
    var nice = parseDate(a.due).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
    if (a.done) return "Was due " + nice;
    if (diff < 0) return "Overdue by " + (-diff) + (diff === -1 ? " day" : " days") + ", due " + nice;
    if (diff === 0) return "Due today";
    if (diff === 1) return "Due tomorrow";
    return "Due " + nice;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- Render ---------- */
  function render() {
    var open = actions.filter(function (a) { return !a.done; }).length;
    var done = actions.length - open;
    var late = actions.filter(isOverdue).length;

    $("n-open").textContent = open;
    $("n-done").textContent = done;
    $("n-late").textContent = late;
    $("stat-late").classList.toggle("has", late > 0);
    var pct = actions.length ? Math.round((done / actions.length) * 100) : 0;
    $("bar-fill").style.width = pct + "%";
    $("bar").setAttribute("aria-valuenow", pct);

    var groups = {};
    actions.forEach(function (a) {
      var k = a.owner.trim().toLowerCase();
      if (!groups[k]) groups[k] = { name: a.owner.trim(), items: [] };
      groups[k].items.push(a);
    });
    var list = Object.keys(groups).map(function (k) { return groups[k]; });
    list.forEach(function (g) {
      g.items.sort(function (a, b) {
        if (a.done !== b.done) return a.done ? 1 : -1;
        return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
      });
      g.open = g.items.filter(function (a) { return !a.done; }).length;
      g.late = g.items.filter(isOverdue).length;
    });
    list.sort(function (a, b) {
      if ((a.open > 0) !== (b.open > 0)) return a.open > 0 ? -1 : 1;
      return a.name.localeCompare(b.name);
    });

    // Owner suggestions: team members first, then anyone already used as an owner
    var dl = $("owner-list");
    dl.textContent = "";
    var seen = {};
    team.map(function (t) { return t.display_name; })
      .concat(list.map(function (g) { return g.name; }))
      .forEach(function (n) {
        var k = n.toLowerCase();
        if (seen[k]) return;
        seen[k] = 1;
        var o = document.createElement("option");
        o.value = n;
        dl.appendChild(o);
      });

    var host = $("owners");
    host.textContent = "";

    if (!list.length) {
      var empty = el("div", "card empty");
      empty.appendChild(el("strong", null, "No actions yet"));
      empty.appendChild(el("span", null, "Add the first action from your meeting above."));
      empty.style.gridColumn = "1 / -1";
      host.appendChild(empty);
      return;
    }

    list.forEach(function (g) {
      var card = el("section", "card owner");
      var head = el("div", "owner-head");
      head.appendChild(el("h3", null, g.name));
      var meta = el("span", "meta");
      meta.appendChild(document.createTextNode(g.open + " open, " + (g.items.length - g.open) + " done"));
      if (g.late) {
        meta.appendChild(document.createTextNode(", "));
        meta.appendChild(el("span", "late", g.late + " overdue"));
      }
      head.appendChild(meta);
      card.appendChild(head);

      var ul = el("ul");
      g.items.forEach(function (a) {
        var od = isOverdue(a);
        var li = el("li", "item" + (a.done ? " done" : "") + (od ? " overdue" : ""));

        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.className = "check";
        cb.checked = !!a.done;
        cb.setAttribute("aria-label", "Mark done: " + a.text);
        cb.addEventListener("change", function () {
          var next = cb.checked, prev = a.done;
          a.done = next; render();
          mutate(function () {
            return sb("?id=eq." + encodeURIComponent(a.id), { method: "PATCH", body: { done: next } });
          }).catch(function () { a.done = prev; render(); fail(); });
        });

        var body = el("div");
        body.appendChild(el("div", "text", a.text));
        body.appendChild(el("div", "due", dueLabel(a)));

        var del = el("button", "del", "\u00d7");
        del.type = "button";
        del.setAttribute("aria-label", "Delete action: " + a.text);
        del.title = "Delete";
        del.addEventListener("click", function () {
          var before = actions.slice();
          actions = actions.filter(function (x) { return x.id !== a.id; });
          render();
          mutate(function () {
            return sb("?id=eq." + encodeURIComponent(a.id), { method: "DELETE" });
          }).catch(function () { actions = before; render(); fail(); });
        });

        li.appendChild(cb); li.appendChild(body); li.appendChild(del);
        ul.appendChild(li);
      });
      card.appendChild(ul);
      host.appendChild(card);
    });
  }

  /* ---------- Add action ---------- */
  function defaultDue() {
    var d = new Date(); d.setDate(d.getDate() + 7);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  $("f-due").value = defaultDue();

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = $("f-text").value.trim();
    var owner = $("f-owner").value.trim();
    var due = $("f-due").value;
    if (!text || !owner || !due) return;

    var known = actions.filter(function (a) { return a.owner.trim().toLowerCase() === owner.toLowerCase(); })[0];
    if (known) owner = known.owner.trim();

    var btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true;
    mutate(function () {
      return sb("", { method: "POST", returning: true, body: { text: text, owner: owner, due: due } })
        .then(function (rows) {
          actions.push(rows[0]);
          $("f-text").value = "";
          $("f-text").focus();
          render();
        });
    }).catch(fail).then(function () { btn.disabled = false; });
  });

  /* ---------- Import old local data (once) ---------- */
  function readOld() {
    try {
      var raw = localStorage.getItem(OLD_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter(function (a) { return a && a.text && a.owner && a.due; }) : [];
    } catch (e) { return []; }
  }
  function offerImport() {
    var old = readOld();
    if (!old.length) { $("import-banner").hidden = true; return; }
    var one = old.length === 1;
    $("import-text").textContent = "Found " + old.length + (one ? " action" : " actions") + " saved in this browser from before. Move " + (one ? "it" : "them") + " to Supabase so the whole team sees " + (one ? "it" : "them") + ".";
    $("import-banner").hidden = false;
  }
  $("import-btn").addEventListener("click", function () {
    var rows = readOld().map(function (a) {
      return { text: String(a.text).slice(0, 200), owner: String(a.owner).slice(0, 40), due: a.due, done: !!a.done };
    });
    if (!rows.length) return;
    $("import-btn").disabled = true;
    mutate(function () { return sb("", { method: "POST", body: rows }); })
      .then(function () {
        try { localStorage.removeItem(OLD_KEY); } catch (e) {}
        $("import-banner").hidden = true;
        return refresh();
      })
      .catch(fail)
      .then(function () { $("import-btn").disabled = false; });
  });

  /* ---------- Start up ---------- */
  function boot() {
    return authedFetch(SB_URL + "/rest/v1/profiles?select=username,display_name,is_admin&id=eq." + encodeURIComponent(session.user_id || ""))
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rows) {
        if (!rows.length) {
          forceSignOut("This account isn\u2019t part of the team. Ask an admin to add you.");
          return;
        }
        me = rows[0];
        showApp();
        if (!$("f-owner").value) $("f-owner").value = me.display_name;
        render();
        offerImport();
        loadTeam().then(refresh);
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(function () { if (!document.hidden) refresh(); }, POLL_MS);
      });
  }

  $("retry").addEventListener("click", refresh);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && session) refresh(); });

  session = loadSession();
  if (session) {
    if (!session.user_id) session.user_id = jwtSub(session.access_token);
    boot().catch(function () { showLogin(""); });
  } else {
    showLogin("");
  }
})();
</script>
</body>
</html>
